<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Use Inter for that modern Capgemini feel -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  
  <!-- Liquid Background Orbs -->
  <div class="liquid-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="popup-container">
    
    <!-- HEADER -->
    <div class="header">
      <div class="logo-row">
        <!-- SVG Liquid Brain/Robot -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93L12 10l-.75-.07A4 4 0 0 1 12 2zm-3 8h6l1 2H8l1-2zm-1 2v6a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-6z"/>
          <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
        </svg>
        <div>
          <h1>AI Co-Pilot</h1>
          <p class="subtitle">Capgemini Interview Platform</p>
        </div>
      </div>
      <div id="status-badge" class="status-badge status-idle">
        <span class="status-dot"></span>
        <span id="status-text">Idle</span>
      </div>
    </div>

    <!-- DETECTING SPINNER -->
    <div id="detecting-card" class="glass-card hidden">
      <div class="detecting-wrap">
        <div class="spinner"></div>
        <span>Detecting Meeting...</span>
      </div>
    </div>

    <!-- AUTO-DETECTED INTERVIEW CARD -->
    <div id="detected-card" class="glass-card detected-card hidden">
      <div class="detected-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        <span>Interview Synced</span>
      </div>
      <div class="detected-row">
        <span class="detected-key">Candidate</span>
        <span id="detected-candidate" class="detected-value">...</span>
      </div>
      <div class="detected-row">
        <span class="detected-key">Job</span>
        <span id="detected-job" class="detected-value">...</span>
      </div>
      <div class="detected-row">
        <span class="detected-key">Role / Stage</span>
        <span id="detected-stage" class="badge-stage">...</span>
      </div>
    </div>

    <!-- NO INTERVIEW FOUND (FALLBACK) -->
    <div id="no-interview-card" class="glass-card hidden" style="border-color: rgba(245,158,11,0.3); text-align: center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px; color:#f59e0b; margin-bottom:8px">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
      </svg>
      <p style="font-size:12px; margin-bottom:4px;">No Interview Detected</p>
      <p style="font-size:10px; color:var(--text-muted)">Please start from the Dashboard or enter IDs below.</p>
    </div>

    <!-- MANUAL CONFIG (COMPLETELY HIDDEN) -->
    <div id="manual-config" class="manual-config glass-card" style="display: none;">
      <div>
        <label class="field-label">Job ID</label>
        <input type="text" id="job-id" class="input-field" placeholder="Enter Reference ID" />
      </div>
      <div style="margin-top: 10px;">
        <label class="field-label">Candidate ID</label>
        <input type="text" id="candidate-id" class="input-field" placeholder="Enter Candidate ID" />
      </div>
      <div style="margin-top: 10px;">
        <label class="field-label">Interviewer Role</label>
        <select id="interviewer-role" class="input-field">
          <option value="ta">Talent Acquisition (TA)</option>
          <option value="manager">Technical Manager</option>
          <option value="hr">Human Resources (HR)</option>
        </select>
      </div>
      
      <!-- Hidden config for Dev -->
      <input type="hidden" id="backend-url" value="http://localhost:3000" />
    </div>

    <!-- LIVE STATS (SHOWN ONLY WHILE RECORDING) -->
    <div id="live-stats" class="live-stats hidden">
      <div class="stat-box">
        <span class="stat-lbl">Time</span>
        <span id="stat-duration" class="stat-val">00:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-lbl">Lines</span>
        <span id="stat-lines" class="stat-val">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-lbl">Hints</span>
        <span id="stat-hints" class="stat-val">0</span>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button id="btn-start" class="btn btn-start" disabled>
        <svg fill="currentColor" viewBox="0 0 16 16" width="16" height="16">
          <path d="M8 14A6 6 0 108 2a6 6 0 000 12z"/>
        </svg>
        Start Intelligence
      </button>
      <button id="btn-stop" class="btn btn-stop" disabled>
        <svg fill="currentColor" viewBox="0 0 16 16" width="16" height="16">
          <rect x="4" y="4" width="8" height="8" rx="1"/>
        </svg>
        End & Analyze
      </button>
    </div>

    <div class="footer">
      Secured communication channel. Interviewee consent required.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
